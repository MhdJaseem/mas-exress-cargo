# Save this file in your repo as: .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # adds a manual "Run workflow" button

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # matches "engines": ">=20.19 <23"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Type-check and build (tsc -b && vite build)
        run: npm run build

      - name: Save the build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist  
